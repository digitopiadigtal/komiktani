<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KomikTani Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f2e9;
      margin: 0;
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #2e7d32;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      width: 100%;
      border-radius: 10px;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>📚 KomikTani Fantasy Library</h1>
  <p style="text-align:center;">
    Perpustakaan komik pertanian
  </p>

  <div class="grid">

    <div class="card">
      <img src="assets/cover1.png" alt="Episode 1">
      <h3>Episode 1: Nadi Nusantara: Catatan Harian Sang Penyuluh</h3>
      <a href="comics/episode-1.html">Baca Sekarang</a>
    </div>

    <div class="card">
      <img src="assets/cover2.png" alt="Episode 2">
      <h3>Episode 2: Pak Mantri Tani & Kawan-kawan</h3>
      <a href="comics/episode-2.html">Baca Sekarang</a>
    </div>

  </div>

</body>
</html>
